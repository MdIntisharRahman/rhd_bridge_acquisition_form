# ==============================================================================
# RHD System for Coordinated Exchange of Design Data (RHD-ADDS / AcqForm)
# Subdomains: acqform.rhdbridge.com, acq.rhdbridge.com
# Upstream: 127.0.0.1:8787 (Unified FastAPI + Built Vite SPA)
# HTTP->HTTPS redirect and ACME challenges handled globally in 000-catchall.conf
# ==============================================================================

server {
    listen      443 ssl;
    listen [::]:443 ssl;

    server_name acqform.rhdbridge.com acq.rhdbridge.com;

    ssl_certificate     /etc/letsencrypt/live/acqform.rhdbridge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acqform.rhdbridge.com/privkey.pem;
    include snippets/tls-params.conf;

    access_log /var/log/nginx/acqform.rhdbridge.com.access.log;
    error_log  /var/log/nginx/acqform.rhdbridge.com.error.log;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        include snippets/proxy-app.conf;
    }
}
